<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>magnetique — Dashboard</title>
  <style>
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('/fonts/Montserrat-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #111314;
      --bg-secondary: #161819;
      --bg-card: #141822;
      --bg-card-hover: #1A1F2C;
      --accent: #D8DCDE;
      --accent-dim: rgba(255, 255, 255, 0.06);
      --text-primary: #EAECEE;
      --text-secondary: #888D91;
      --text-muted: #555A5E;
      --border: rgba(100, 130, 180, 0.1);
      --border-hover: rgba(100, 130, 180, 0.2);
      --teal: #00E5B0;
      --success: #5BCC8A;
      --success-dim: rgba(91, 204, 138, 0.1);
      --warning: #E0A84D;
      --warning-dim: rgba(224, 168, 77, 0.1);
      --error: #E06464;
      --error-dim: rgba(224, 100, 100, 0.1);
      --info: #6BA3D4;
      --info-dim: rgba(107, 163, 212, 0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 6px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .nav-links a {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: var(--radius-xs);
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover {
      color: var(--text-secondary);
      background: var(--accent-dim);
    }

    .nav-links .nav-active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      font-weight: 600;
    }

    .nav-brand {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }

    .nav-user .username {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .btn-logout {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-logout:hover {
      color: var(--error);
      border-color: rgba(224, 100, 100, 0.3);
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .page-heading {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 36px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px;
      padding-left: 2px;
    }

    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .workflow-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 22px;
      transition: border-color 0.2s, transform 0.15s;
    }

    .workflow-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .wf-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .wf-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .wf-status {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .wf-status.active {
      background: var(--success-dim);
      color: var(--success);
    }

    .wf-status.inactive {
      background: var(--accent-dim);
      color: var(--text-muted);
    }

    .wf-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .wf-footer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-trigger {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
      background: transparent;
      border: 1px solid var(--teal);
      padding: 9px 22px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-trigger:hover {
      transform: translateY(-1px);
      background: rgba(0, 229, 176, 0.08);
    }

    .btn-trigger:active { transform: translateY(0); }

    .btn-trigger:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-trigger .icon-play {
      display: inline-block;
      width: 0;
      height: 0;
      border-left: 7px solid var(--teal);
      border-top: 4.5px solid transparent;
      border-bottom: 4.5px solid transparent;
    }

    .wf-result {
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      display: none;
    }

    .wf-result.running { display: inline-block; color: var(--warning); background: var(--warning-dim); }
    .wf-result.success { display: inline-block; color: var(--success); background: var(--success-dim); }
    .wf-result.error { display: inline-block; color: var(--error); background: var(--error-dim); }

    .admin-section { display: none; }
    .admin-section.visible { display: block; }

    .user-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 14px;
    }

    .user-table th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .user-table td {
      font-size: 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .user-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .badge-admin { color: var(--info); background: var(--info-dim); }
    .badge-user { color: var(--text-muted); background: var(--accent-dim); }

    .btn-small {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-small:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .btn-small.danger:hover { border-color: rgba(224, 100, 100, 0.3); color: var(--error); }

    .add-user-form {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .add-user-form input, .add-user-form select {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .add-user-form input:focus, .add-user-form select:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .add-user-form input::placeholder { color: var(--text-muted); }

    .btn-add {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-add:hover { transform: translateY(-1px); opacity: 0.85; }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      animation: toastIn 0.3s ease;
      max-width: 340px;
    }

    .toast.success { background: var(--success-dim); color: var(--success); border: 1px solid rgba(91, 204, 138, 0.2); }
    .toast.error { background: var(--error-dim); color: var(--error); border: 1px solid rgba(224, 100, 100, 0.2); }
    .toast.info { background: var(--info-dim); color: var(--info); border: 1px solid rgba(107, 163, 212, 0.2); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page { display: none; }
    .page.active { display: block; }

    @media (max-width: 640px) {
      .nav { padding: 14px 16px; grid-template-columns: 1fr; gap: 10px; text-align: center; }
      .nav-links { justify-content: center; }
      .nav-user { justify-content: center; }
      .main { padding: 24px 16px; }
      .page-heading { font-size: 24px; }
      .workflow-grid { grid-template-columns: 1fr; }
      .add-user-form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-links">
      <a href="#" data-page="workflows" class="nav-active">.workflows</a>
      <a href="#" data-page="admin" class="nav-link-admin" style="display:none">.admin</a>
    </div>
    <div class="nav-brand">magnetique</div>
    <div class="nav-user">
      <span class="username" id="navUsername"></span>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </nav>

  <div class="main">
    <div class="page active" id="page-workflows">
      <p class="page-title">Automatisierungen</p>
      <h1 class="page-heading">Workflows</h1>
      <div class="section-label">Verfügbare Workflows</div>
      <div class="workflow-grid" id="workflowGrid"></div>
    </div>

    <div class="page" id="page-admin">
      <p class="page-title">Verwaltung</p>
      <h1 class="page-heading">Benutzer</h1>
      <div class="section-label">Aktive Benutzer</div>
      <table class="user-table">
        <thead>
          <tr><th>Benutzername</th><th>Rolle</th><th>Erstellt</th><th></th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
      <div class="section-label" style="margin-top: 28px;">Neuen Benutzer anlegen</div>
      <form class="add-user-form" id="addUserForm">
        <input type="text" id="newUsername" placeholder="Benutzername" required>
        <input type="password" id="newPassword" placeholder="Passwort" required>
        <select id="newRole"><option value="user">User</option><option value="admin">Admin</option></select>
        <button type="submit" class="btn-add">+ Hinzufügen</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script>
    const WORKFLOW_META = {
      'Batch-Sortierung': { desc: 'Stapel-Scan aus der Batch-Inbox analysieren, Briefe trennen, benennen, in Google Drive ablegen und Slack-Zusammenfassung posten.' },
      'Ablage': { desc: 'Ältere Dokumente aus dem Ablage-Ordner auslesen, benennen und in die korrekte Google Drive Ordnerstruktur einsortieren.' },
      'Posteingang': { desc: 'Einzelnen Brief-Scan verarbeiten — Inhalt analysieren, Datei umbenennen, in Drive ablegen und Slack-Nachricht senden.' }
    };

    let currentUser = null;

    async function init() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login'; return; }
        currentUser = await res.json();
        document.getElementById('navUsername').textContent = currentUser.username;
        if (currentUser.role === 'admin') document.querySelector('.nav-link-admin').style.display = '';
        loadWorkflows();
      } catch { window.location.href = '/login'; }
    }

    async function loadWorkflows() {
      const grid = document.getElementById('workflowGrid');
      try {
        const res = await fetch('/api/workflows');
        const workflows = await res.json();
        if (!Array.isArray(workflows) || workflows.length === 0) {
          grid.innerHTML = '<p style="color: var(--text-muted);">Keine Workflows gefunden.</p>';
          return;
        }
        grid.innerHTML = workflows.map(wf => {
          const meta = WORKFLOW_META[wf.name] || { desc: 'n8n Workflow' };
          return `
            <div class="workflow-card" data-id="${wf.id}">
              <div class="wf-header">
                <div class="wf-name">${wf.name}</div>
                <span class="wf-status ${wf.active ? 'active' : 'inactive'}">${wf.active ? 'Aktiv' : 'Manuell'}</span>
              </div>
              <p class="wf-desc">${meta.desc}</p>
              <div class="wf-footer">
                <button class="btn-trigger" onclick="triggerWorkflow('${wf.id}', this)">
                  <span class="icon-play"></span> Starten
                </button>
                <span class="wf-result" id="result-${wf.id}"></span>
              </div>
            </div>`;
        }).join('');
      } catch { grid.innerHTML = '<p style="color: var(--error);">n8n nicht erreichbar</p>'; }
    }

    async function triggerWorkflow(id, btn) {
      const result = document.getElementById(`result-${id}`);
      btn.disabled = true;
      btn.innerHTML = 'Wird gestartet...';
      result.className = 'wf-result running';
      result.style.display = 'inline-block';
      result.textContent = 'Startet...';
      try {
        const res = await fetch(`/api/workflows/${id}/trigger`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          result.className = 'wf-result success';
          result.textContent = 'Gestartet';
          showToast('Workflow gestartet', 'success');
          if (data.executionId) pollExecution(data.executionId, result);
        } else {
          result.className = 'wf-result error';
          result.textContent = data.error || 'Fehler';
          showToast(data.error || 'Fehler beim Start', 'error');
        }
      } catch {
        result.className = 'wf-result error';
        result.textContent = 'Verbindungsfehler';
        showToast('Server nicht erreichbar', 'error');
      }
      btn.disabled = false;
      btn.innerHTML = '<span class="icon-play"></span> Starten';
    }

    async function pollExecution(execId, resultEl) {
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        if (attempts > 120) { clearInterval(poll); return; }
        try {
          const res = await fetch(`/api/executions/${execId}`);
          const data = await res.json();
          if (data.status === 'success' || data.finished) {
            resultEl.className = 'wf-result success';
            resultEl.textContent = 'Abgeschlossen';
            clearInterval(poll);
          } else if (data.status === 'error' || data.status === 'crashed') {
            resultEl.className = 'wf-result error';
            resultEl.textContent = 'Fehlgeschlagen';
            clearInterval(poll);
          } else {
            resultEl.textContent = `Läuft... (${attempts * 5}s)`;
          }
        } catch {}
      }, 5000);
    }

    document.querySelectorAll('[data-page]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('[data-page]').forEach(l => l.classList.remove('nav-active'));
        document.getElementById(`page-${page}`).classList.add('active');
        link.classList.add('nav-active');
        if (page === 'admin') loadUsers();
      });
    });

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const users = await res.json();
        document.getElementById('userTableBody').innerHTML = users.map(u => `
          <tr>
            <td style="color: var(--text-primary); font-weight: 600;">${u.username}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString('de-DE')}</td>
            <td>${u.role !== 'admin' ? `<button class="btn-small danger" onclick="deleteUser(${u.id}, '${u.username}')">Entfernen</button>` : ''}</td>
          </tr>`).join('');
      } catch { showToast('Benutzer konnten nicht geladen werden', 'error'); }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;
      try {
        const res = await fetch('/api/users', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        if (res.ok) {
          showToast(`"${username}" angelegt`, 'success');
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          loadUsers();
        } else { showToast(data.error, 'error'); }
      } catch { showToast('Fehler beim Anlegen', 'error'); }
    });

    async function deleteUser(id, username) {
      if (!confirm(`"${username}" wirklich entfernen?`)) return;
      try {
        const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
        if (res.ok) { showToast(`"${username}" entfernt`, 'info'); loadUsers(); }
      } catch { showToast('Fehler beim Entfernen', 'error'); }
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toasts');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    init();
  </script>
</body>
</html>
